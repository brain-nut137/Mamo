<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mamo – Your Life in Pictures</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff7f0;--card:#ffffffcc;--ink:#3b2a3f;--mute:#8a7490;--a:#ff7a9c;--b:#8e7dff;--c:#ffb86b;--line:#e9d9f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17111d;--card:#2a2034cc;--ink:#f6eaf8;--mute:#b6a2c0;--line:#44345a}}
:root[data-theme="dark"]{--bg:#17111d;--card:#2a2034cc;--ink:#f6eaf8;--mute:#b6a2c0;--line:#44345a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;animation:float 14s ease-in-out infinite}
.b1{width:340px;height:340px;background:var(--a);top:-80px;left:-80px}
.b2{width:300px;height:300px;background:var(--b);bottom:-60px;right:-60px;animation-delay:-5s}
.b3{width:220px;height:220px;background:var(--c);top:45%;left:55%;animation-delay:-9s}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.15)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px 110px}
header{text-align:center;margin:10px 0 18px}
h1{font-size:2.3rem;margin:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
header p{margin:4px 0 0;color:var(--mute);font-style:italic}
nav{display:flex;gap:6px;background:var(--card);backdrop-filter:blur(10px);padding:5px;border-radius:99px;margin:0 auto 22px;max-width:360px;border:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px;border-radius:99px;font:inherit;cursor:pointer;transition:.3s}
nav button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 4px 14px #8e7dff55}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:22px;box-shadow:0 10px 30px #8e7dff22;animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms);transition:transform .35s}
.card:hover{transform:translateY(-4px) rotate(-.4deg)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.96)}}
.card img{width:100%;display:block;max-height:460px;object-fit:cover}
.body{padding:14px 18px 16px}
.cap{font-size:1.15rem;margin:0 0 4px}.mem{margin:6px 0 0;color:var(--mute);line-height:1.5;font-size:.95rem}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--mute);gap:8px;flex-wrap:wrap}
.pill{padding:3px 10px;border-radius:99px;background:linear-gradient(135deg,#ff7a9c22,#8e7dff22);border:1px solid var(--line)}
.year{font-size:1.9rem;margin:28px 0 10px;text-align:center;color:var(--b);position:relative;animation:rise .6s both}
.year::before,.year::after{content:"✦";font-size:.9rem;color:var(--a);margin:0 12px;display:inline-block;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tl{position:relative;padding-left:26px}.tl::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:3px;border-radius:3px;background:linear-gradient(var(--a),var(--b),var(--c))}
.tl .card::before{content:"";position:absolute;left:-26px;top:22px;width:15px;height:15px;border-radius:50%;background:var(--a);border:3px solid var(--bg);animation:pulse 2.4s infinite}
.tl .card{position:relative;overflow:visible}.tl .card img{border-radius:22px 22px 0 0}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ff7a9c33}}
.act{display:flex;gap:8px}.act button,.link{border:0;background:none;color:var(--b);cursor:pointer;font:inherit;font-size:.85rem}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:5;width:62px;height:62px;border-radius:50%;border:0;font-size:2rem;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 24px #8e7dff88;cursor:pointer;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.empty{text-align:center;color:var(--mute);padding:50px 10px;animation:rise .8s both}.empty b{display:block;font-size:2.6rem;animation:bob 3s infinite}
.modal{position:fixed;inset:0;background:#0008;z-index:10;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .4s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{margin:0 0 12px}label{display:block;font-size:.8rem;color:var(--mute);margin:12px 0 4px}
input,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:80px;resize:vertical}
.drop{border:2px dashed var(--b);border-radius:16px;padding:18px;text-align:center;color:var(--mute);cursor:pointer}.drop img{max-width:100%;max-height:200px;border-radius:12px}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.seg button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}
.go{width:100%;margin-top:18px;padding:13px;border:0;border-radius:14px;font:inherit;font-size:1.05rem;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer}.go:disabled{opacity:.5}
.note{font-size:.78rem;color:var(--mute);text-align:center;margin-top:8px}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
<header><h1>Mamo</h1><p>every moment, a memory worth keeping</p><button class="link" id="out" style="display:none;margin-top:6px">Log out</button></header>
<nav><button id="t-life" class="on">My Life</button><button id="t-feed">Community</button></nav>
<div id="list"></div>
</main>
<button class="fab" id="fab" title="Add a memory">+</button>
<div class="modal" id="modal"><div class="sheet">
<h2 id="mt">New memory</h2>
<div class="drop" id="drop">📷 Tap to choose a picture</div>
<input type="file" id="file" accept="image/*" hidden>
<label>Caption – what was happening?</label><input id="cap" maxlength="140" placeholder="First day at college…">
<label>Date (you can change it anytime)</label><input id="date" type="date">
<label>Memory (optional story)</label><textarea id="mem" maxlength="800" placeholder="Write what you felt, who was there…"></textarea>
<label>Who can see it?</label>
<div class="seg"><button id="v-pub" class="on">🌍 Public</button><button id="v-priv">🔒 Private</button></div>
<button class="go" id="save">Save memory</button>
<button class="link" id="cancel" style="display:block;margin:12px auto 0">Cancel</button>
<div class="note" id="note"></div>
</div></div>
<div class="modal" id="auth"><div class="sheet"><h2>Welcome to Mamo</h2>
<label>Your name</label><input id="au" autocomplete="username" maxlength="20" placeholder="e.g. prem_k">
<label>Password (6+ characters)</label><input id="ap" type="password" autocomplete="current-password">
<button class="go" id="alogin">Log in</button><button class="link" id="areg" style="display:block;margin:12px auto 0">Create a new account</button><div class="note" id="anote"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>{try{return new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
// Safe to keep in browser code: this is the public (anon) key. Your data is protected by the RLS rules in schema.sql.
const SB=supabase.createClient('https://jepttnsiroszcalbjldr.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplcHR0bnNpcm9zemNhbGJqbGRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MzQyNTgsImV4cCI6MjEwODQxMDI1OH0.Ceu9kLGrhRaRGTJQQ7eT5R1oW0r80QQI7fGGqR9Kjow');
let mine=[],feed=[],view='life',edit=null,vis='public',blob=null,preview='',me=null;
async function signed(rows){
  if(!rows.length)return rows;
  const {data}=await SB.storage.from('photos').createSignedUrls(rows.map(r=>r.image_path),3600);
  const m={};(data||[]).forEach(d=>m[d.path]=d.signedUrl);
  return rows.map(r=>({...r,image_url:m[r.image_path]||''}));
}
async function refresh(){
  const a=await SB.from('photos').select('*').eq('user_id',me.id).order('taken_on');
  const b=await SB.from('photos').select('*, profiles(username)').eq('visibility','public').order('created_at',{ascending:false}).limit(60);
  if(a.error)throw a.error;if(b.error)throw b.error;
  mine=await signed(a.data);
  feed=(await signed(b.data)).map(p=>({...p,author:p.profiles&&p.profiles.username,is_mine:p.user_id===me.id}));
  render();
}
async function init(){
  const {data:{session}}=await SB.auth.getSession();
  if(!session){$('auth').classList.add('open');return}
  me=session.user;$('auth').classList.remove('open');$('out').style.display='inline';
  try{await refresh()}catch(e){$('note').textContent='Could not load: '+e.message}
  render();
}
async function authGo(kind){
  const n=$('anote'),name=$('au').value.trim().toLowerCase(),password=$('ap').value;
  if(!/^[a-z0-9_.-]{3,20}$/.test(name)){n.textContent='Name: 3–20 letters, numbers, _ . or -';return}
  n.textContent='Please wait…';
  const email=name+'@mamo.app'; // internal login id only, no email is ever sent
  const r=kind==='login'?await SB.auth.signInWithPassword({email,password}):
    await SB.auth.signUp({email,password,options:{data:{username:name}}});
  if(r.error){n.textContent=/already registered/i.test(r.error.message)?'That name is taken. Pick another, or log in.':/invalid login/i.test(r.error.message)?'Wrong name or password.':r.error.message;return}
  if(!r.data.session){n.textContent='Sign-up needs email confirmation turned off in Supabase (see setup note).';return}
  $('ap').value='';n.textContent='';await init();
}
$('alogin').onclick=()=>authGo('login');$('areg').onclick=()=>authGo('signup');
$('out').onclick=async()=>{await SB.auth.signOut();location.reload()};
function card(p,i,showAuthor){
  const priv=p.visibility==='private';
  return `<article class="card" style="--i:${Math.min(i,10)}"><img loading="lazy" src="${esc(p.image_url)}" alt="${esc(p.caption)}">
  <div class="body"><h3 class="cap">${esc(p.caption||'Untitled moment')}</h3>
  <div class="meta"><span>📅 ${fmt(p.taken_on)}</span><span class="pill">${priv?'🔒 Private':'🌍 Public'}</span>
  ${showAuthor?`<span>by ${esc(p.author||'a friend')}</span>`:''}
  ${p.is_mine?`<span class="act"><button data-e="${p.id}">Edit</button><button data-d="${p.id}">Delete</button></span>`:''}</div>
  ${p.memory?`<p class="mem">${esc(p.memory)}</p>`:''}</div></article>`}
function render(){
  const L=$('list');
  if(view==='life'){
    const all=[...mine].map(p=>({...p,is_mine:true})).sort((a,b)=>String(a.taken_on)<String(b.taken_on)?-1:1);
    if(!all.length){L.innerHTML='<div class="empty"><b>🌱</b>Your story starts here.<br>Tap + to add your first picture.</div>';return}
    let h='',y='',i=0;
    all.forEach(p=>{const yr=String(p.taken_on).slice(0,4);if(yr!==y){if(y)h+='</div>';y=yr;h+=`<div class="year">${yr}</div><div class="tl">`}h+=card(p,i++,false)});
    L.innerHTML=h+'</div>';
  }else L.innerHTML=feed.length?feed.map((p,i)=>card(p,i,true)).join(''):'<div class="empty"><b>🌍</b>No public memories yet.<br>Be the first to share one.</div>';
}
$('t-life').onclick=()=>{view='life';$('t-life').classList.add('on');$('t-feed').classList.remove('on');render()};
$('t-feed').onclick=()=>{view='feed';$('t-feed').classList.add('on');$('t-life').classList.remove('on');render()};
function setVis(v){vis=v;$('v-pub').classList.toggle('on',v==='public');$('v-priv').classList.toggle('on',v==='private')}
$('v-pub').onclick=()=>setVis('public');$('v-priv').onclick=()=>setVis('private');
function open(p){
  edit=p||null;blob=null;preview=p?p.image_url:'';
  $('mt').textContent=p?'Edit memory':'New memory';
  $('cap').value=p?p.caption||'':'';$('mem').value=p?p.memory||'':'';
  $('date').value=p?String(p.taken_on).slice(0,10):new Date().toISOString().slice(0,10);
  setVis(p?p.visibility:'public');
  $('drop').innerHTML=preview?`<img src="${esc(preview)}">`:'📷 Tap to choose a picture';
  $('modal').classList.add('open');
}
$('fab').onclick=()=>open();$('cancel').onclick=()=>$('modal').classList.remove('open');
$('drop').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;blob=await shrink(f);preview=URL.createObjectURL(blob);$('drop').innerHTML=`<img src="${preview}">`};
function shrink(f){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b||f),'image/jpeg',.85)};im.onerror=()=>res(f);im.src=URL.createObjectURL(f)})}
$('save').onclick=async()=>{
  const nt=$('note');
  if(!edit&&!blob){nt.textContent='Please choose a picture first.';return}
  $('save').disabled=true;nt.textContent='Saving…';
  try{
    let path=edit?edit.image_path:null,oldPath=null;
    if(blob){
      oldPath=path;path=me.id+'/'+Date.now()+'.jpg';
      const u=await SB.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});if(u.error)throw u.error;
    }
    const row={image_path:path,caption:$('cap').value.trim(),memory:$('mem').value.trim()||null,taken_on:$('date').value,visibility:vis,updated_at:new Date().toISOString()};
    const r=await(edit?SB.from('photos').update(row).eq('id',edit.id):SB.from('photos').insert(row));
    if(r.error)throw r.error;
    if(oldPath)await SB.storage.from('photos').remove([oldPath]);
    await refresh();$('modal').classList.remove('open');nt.textContent='';
  }catch(e){nt.textContent='Could not save: '+(e.message||e)}
  $('save').disabled=false;
};
$('list').onclick=async e=>{
  const ed=e.target.dataset.e,de=e.target.dataset.d;
  if(ed){const p=mine.find(x=>x.id==ed);if(p)open(p)}
  if(de&&confirm('Delete this memory?')){
    const p=mine.find(x=>x.id==de),r=await SB.from('photos').delete().eq('id',de);
    if(r.error)return alert(r.error.message);
    if(p)await SB.storage.from('photos').remove([p.image_path]);
    await refresh();
  }
};
init();
</script></body></html>
